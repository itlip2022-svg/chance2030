                  content: '<p><strong>Ihr Insider-Guide ist da! 📖</strong></p><p>Auf 18 Seiten haben wir aufgeschrieben, was wir unseren Gästen sonst am Frühstückstisch erzählen: Museen, Torfkahnfahrten, das Kranich-Schauspiel, unsere Lieblingscafés, Fotospots und zehn Insider-Regeln für einen entspannten Besuch.</p><p style="text-align:center;"><a href="https://entdecken.ferienwohnung-in-worpswede.de/downloads/worpswede-insider-guide.pdf" target="_blank"><strong>→ Worpswede-Insider-Guide herunterladen (PDF)</strong></a></p><p>Dazu schicken wir Ihnen gelegentlich weitere Lieblingsorte, freie Last-Minute-Termine und Neues aus dem Atelier — kein Spam, versprochen.</p><p>Wenn Sie Fragen haben: Antworten Sie einfach auf diese E-Mail, wir lesen persönlich.</p><p>Herzliche Grüße aus Worpswede<br><strong>Markus Lippeck &amp; Anna Schill</strong></p>'
